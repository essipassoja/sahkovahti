# Sähkövahti configuration
# Edit, then restart the app. All prices are in cents/kWh (c/kWh) unless noted.

[app]
timezone = "Europe/Helsinki"
db_path = "data/energy.db"
host = "0.0.0.0"          # 0.0.0.0 = reachable from other devices on your home network
port = 8080

[prices]
# Finnish day-ahead spot prices, 15-minute resolution (Nord Pool MTU changed to 15 min on 1 Oct 2025)
url = "https://api.porssisahko.net/v2/latest-prices.json"
refresh_minutes = 30
# porssisahko.net publishes prices with Finnish VAT (25.5 %) included.
# If you switch to a source that gives VAT-free prices, set this to false.
prices_include_vat = true
vat_percent = 25.5
# Optional: load prices from a local JSON file instead (same format as the API). Useful offline.
# fixture_file = "tests/fixtures/prices_sample.json"

[tariff]
# What you actually pay on top of spot. Check your contract and grid company invoice.
# All values INCLUDING VAT.
retailer_margin_c_kwh = 0.49     # your electricity company's margin ("marginaali")
transfer_c_kwh        = 4.00     # grid transfer fee ("siirtomaksu, energia")
electricity_tax_c_kwh = 2.827    # electricity tax (sähkövero) incl. VAT — CHECK your invoice, the rate changes with budgets
monthly_fixed_eur     = 0.0      # basic fees (perusmaksut) — shown in monthly totals only

[meter]
# simulator | p1_serial | p1_tcp | mqtt
source = "simulator"
# How often a reading is written to the database (the meter sends every ~1–10 s)
store_interval_s = 10
# Simulator only: generate this many days of fake history on first start
simulator_backfill_days = 14

[meter.p1_serial]
# USB-to-HAN adapter (RJ12). Finnish meters send DSMR-style ASCII telegrams, 115200 8N1.
port = "/dev/ttyUSB0"
baudrate = 115200
invert = false            # some DIY cables need inverted signal — usually handled in hardware

[meter.p1_tcp]
# Wi-Fi HAN readers that expose the raw telegram over TCP (ser2net / "raw TCP" mode)
host = "192.168.1.50"
port = 23

[meter.mqtt]
# ESP32 HAN readers that publish to MQTT. Requires: pip install paho-mqtt
host = "localhost"
port = 1883
username = ""
password = ""
topic = "han/telegram"
# "telegram" = payload is the raw P1 telegram text
# "json"     = payload is JSON; map your reader's field names below
payload = "telegram"

[meter.mqtt.json_fields]
import_kwh = "import_kwh"         # cumulative imported energy, kWh
export_kwh = "export_kwh"         # cumulative exported energy, kWh (solar), optional
power_w    = "power_w"            # instantaneous import power, W
export_power_w = "export_power_w" # optional
