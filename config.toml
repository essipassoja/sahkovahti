# Sähkövahti configuration
# Edit, then restart the app. All prices are in cents/kWh (c/kWh) unless noted.

[app]
timezone = "Europe/Helsinki"
db_path = "data/energy.db"
host = "0.0.0.0"          # 0.0.0.0 = reachable from other devices on your home network
port = 8080

[prices]
# Finnish day-ahead spot prices, 15-minute resolution (Nord Pool MTU changed to 15 min on 1 Oct 2025)
url = "https://api.porssisahko.net/v2/latest-prices.json"
refresh_minutes = 30
# porssisahko.net publishes prices with Finnish VAT (25.5 %) included.
# If you switch to a source that gives VAT-free prices, set this to false.
prices_include_vat = true
vat_percent = 25.5        # VAT used by the price source — your own VAT rate is in [tariff]
# Optional: load prices from a local JSON file instead (same format as the API). Useful offline.
# fixture_file = "tests/fixtures/prices_sample.json"

[tariff]
# Defaults for your contract. Easier: edit these on the Settings page (menu → Settings) —
# values saved there override this section until you press "Reset to config.toml".
# All prices in c/kWh and fees in €/month WITHOUT VAT ("alv 0 %"); vat_percent is added on top of everything.

# --- electricity contract (sähkösopimus) ---
retailer_name         = ""
retailer_margin_c_kwh = 0.39     # your electricity company's margin ("marginaali")
spot_discount_percent = 0.0      # e.g. 30 = you pay 70 % of the spot price ("-30 % pörssisähköstä")
discount_until        = ""       # last day of the discount, "YYYY-MM-DD"; "" = no end date
negative_spot_as_zero = false    # true if negative spot prices are billed as 0
retailer_monthly_eur  = 0.0      # retailer basic fee (perusmaksu), €/month — normal price
# Optional introductory basic fee, e.g. 0 €/month for the first 6 months. Leave out for none.
# retailer_monthly_promo_eur   = 0.0
retailer_monthly_promo_from  = ""   # first day, "YYYY-MM-DD"; "" = from the start
retailer_monthly_promo_until = ""   # last day; after it the normal fee applies

# --- grid / transfer (sähkönsiirto) ---
grid_company          = ""
# flat      = yleissiirto: one price all the time (transfer_c_kwh)
# day_night = aikasiirto: peak price between peak_start_hour and peak_end_hour every day
# seasonal  = kausisiirto: peak price Nov–Mar, Mon–Sat between those hours; other times off-peak
transfer_mode          = "flat"
transfer_c_kwh         = 3.19    # flat transfer price ("siirtomaksu, energia")
transfer_peak_c_kwh    = 0.0     # day / winter weekday price
transfer_offpeak_c_kwh = 0.0     # night / other time price
peak_start_hour        = 7
peak_end_hour          = 22
grid_monthly_eur       = 0.0     # grid basic fee (perusmaksu), €/month

electricity_tax_c_kwh = 2.253    # electricity tax (sähkövero), class I, without VAT — the rate changes with budgets
vat_percent           = 25.5     # VAT (arvonlisävero), added to spot, margin, transfer, tax and basic fees

[weather]
# Weather on the front page, from MET Norway (the data behind yr.no) — free, no API key.
# Easiest: set the location on the Settings page (menu → Settings → Weather, with a place search);
# values saved there override this section. Max 4 decimals of the coordinates are used.
enabled   = true
place     = "Helsinki"
latitude  = 60.1699
longitude = 24.9384

[traffic_light]
# The front page shows green / yellow / red: is now a good time to run big loads
# (sauna, EV charging, laundry, dishwasher)? Thresholds in c/kWh.
green_below = 5.0      # cheaper than this → green
red_above   = 15.0     # more expensive than this → red; in between → yellow
# Thresholds are compared INCLUDING VAT, like the prices most Finnish apps show.
# "spot"  = your spot price incl. VAT, after your discount (what you pay for the energy itself)
# "total" = that + margin + transfer + tax (raise the thresholds by ~7 c if you use this)
basis = "spot"

[meter]
# simulator | p1_serial | p1_tcp | mqtt
source = "simulator"
# How often a reading is written to the database (the meter sends every ~1–10 s)
store_interval_s = 10
# Simulator only: generate this many days of fake history on first start
simulator_backfill_days = 14

[meter.p1_serial]
# USB-to-HAN adapter (RJ12). Finnish meters send DSMR-style ASCII telegrams, 115200 8N1.
port = "/dev/ttyUSB0"
baudrate = 115200
invert = false            # some DIY cables need inverted signal — usually handled in hardware

[meter.p1_tcp]
# Wi-Fi HAN readers that expose the raw telegram over TCP (ser2net / "raw TCP" mode)
host = "192.168.1.50"
port = 23

[meter.mqtt]
# ESP32 HAN readers that publish to MQTT. Requires: pip install paho-mqtt
host = "localhost"
port = 1883
username = ""
password = ""
topic = "han/telegram"
# "telegram" = payload is the raw P1 telegram text
# "json"     = payload is JSON; map your reader's field names below
payload = "telegram"

[meter.mqtt.json_fields]
import_kwh = "import_kwh"         # cumulative imported energy, kWh
export_kwh = "export_kwh"         # cumulative exported energy, kWh (solar), optional
power_w    = "power_w"            # instantaneous import power, W
export_power_w = "export_power_w" # optional
